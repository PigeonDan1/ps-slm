input_scp: example/data/clean/wav.scp
output_dir: example/data/example_binssp_dump

archive: false
transforms:
  - name: pad_silence
    time_padding: [5, 0]
  - name: volume_perturb
    choices: [-45]
  - name: apply_impluse_response
    ir_path: example/data/rir/4ch.wavlist
    ir_num_channel: 4
  - name: pad_silence
    channel_padding: [0, 2]
  - name: add_background_noise
    sounds_path: /mnt/lustre/hpc_stor01/group/on_device/comm_data/iot/addnoise/4mic_35mm/commnoise.wavlist
    min_snr_in_db: 3
    max_snr_in_db: 10
  - name: binssp_dump
    dump_dir: example/data/example_binssp_dump/tmp
    bintool: '/mnt/lustre/hpc_stor01/home/bei.jiao/data/testset/wkptools/multi/sspe_test-linux_x86-64-1.68.0-20240920112916 -b /hpc_stor02/home/xinlin.huang/IOT_project/20241220-haixin-ula4mic35mm/tool/20250314/beam2_48_beam3_10_public_4mic_120-150_sir-3-offset0.2.bin -w /mnt/lustre/hpc_stor01/home/zuohao.li/mytools/common_sspe_tools/wkp_res_py.bin -e "words=ni hao;thresh=10;" -f '
    bintool_flag: d
    out_channel: 4
    post_fix: wkp
    cleanData: True
  - name: select_beam
    rir_beam_path: example/data/rir/4ch_rir_beam
