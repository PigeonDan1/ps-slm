input_scp: tmp_dir/wav.scp
output_dir: tmp_dir/wav_out
archive: True
transforms:
  - name: volume_perturb
    choices: [-25, -28, -31, -33, -35, -37, -39, -40, -41, -43, -45, -47, -49, -52, -55]
    p: 1.0
  - name: concat
  - name: apply_impluse_response
    ir_path: /mnt/lustre/aifs/fgfs/users/fx310/work22/corpus/2mic_30mm_rir/rir.wavlist
    ir_num_channel: 2
  - name: pad_silence
    time_padding: [5, 0]
  - name: add_background_noise
    min_snr_in_db: 0
    max_snr_in_db: 20
    sounds_path: /mnt/lustre/aifs/fgfs/users/fx310/work22/corpus/2mic_30mm_noise/comm_expo_noise.wavlist
  - name: mutually_exclusive_group
    transforms:
      - name: cstub_gsc
      - name: dcrnmask
        model_path: /mnt/lustre02/jiangsu/aispeech/home/jfc20/work22/taihang_project/proj_pipeline/asr_pipeline/cn_dcrn_train/dcrn_export_tools/exp/data-3cm-newdisang/checkpoint.multibeam_0924_fuseConvBN2DPrelu_Em
        wav_name: "GSC-tfmask"
        extensions:
          - quantize
          - nsp
    p: [0.2, 0.8]
  - name: select_beam
    rir_beam_path: /mnt/lustre/aifs/fgfs/users/fx310/work22/corpus/2mic_30mm_rir/beam.map
  - name: time_trim
    trim: [5, 0]
  - name: mutually_exclusive_group
    transforms:
      - name: eq_perturb
      - name: resample
        target_sample_rate: 8000
    p: [0.05, 0.05]

