input_scp: YD_bjq_in/wav_cat6.scp
output_dir: YD_bjq_out/gsc-nnbf_wav
archive: True
transforms:
  - name: volume_perturb
  choices: [-25, -28, -31, -33, -35, -37, -39, -40, -41, -43, -45, -47, -49, -52, -55]
    p: 1.0
  - name: concat
  - name: apply_impluse_response
    ir_path: /mnt/lustre/aifs/fgfs/users/fx310/work22/corpus/2mic_30mm_rir/rir.wavlist
    ir_num_channel: 2
  - name: pad_silence
    time_padding: [5, 0]
  - name: add_background_noise
    min_snr_in_db: 0
    max_snr_in_db: 20
    sounds_path: /mnt/lustre/aifs/fgfs/users/fx310/work22/corpus/2mic_30mm_noise/comm_expo_noise.wavlist
  - name: mutually_exclusive_group
    transforms:
      - name: cstub_gsc
      - name: nnmask
        model_path: /mnt/lustre02/jiangsu/aispeech/home/hl219/work22/th_project/0000_Common/nnbf/exp/2mic_30mm/comm2022V2_0508/qat_rnnbf_si-snr/checkpoint-4
        wav_name: "GSC-tfmask"
        extensions:
          - quantize
          - nsp
      - name: nnmask
        model_path: /mnt/lustre02/jiangsu/aispeech/home/hl219/work22/th_project/0000_Common/nnbf/exp/2mic_30mm/comm2022V2_0508/qat_rnnbf_mb_si-snr/checkpoint-4
        wav_name: "GSC-tfmask"
        extensions:
          - quantize
          - nsp
      - name: nnmask
        model_path: /mnt/lustre02/jiangsu/aispeech/home/hl219/work22/th_project/0000_Common/nnbf/exp/2mic_30mm/comm2022V2_0618/qat_rnnbf_si-snr.gain15db/checkpoint-3
        wav_name: "GSC-tfmask"
        extensions:
          - quantize
          - nsp
    p: [0.4, 0.2, 0.2, 0.2]
  - name: select_beam
    rir_beam_path: /mnt/lustre/aifs/fgfs/users/fx310/work22/corpus/2mic_30mm_rir/beam.map
  - name: time_trim
    trim: [5, 0]
  - name: mutually_exclusive_group
    transforms:
      - name: eq_perturb
      - name: resample
        target_sample_rate: 8000
    p: [0.05, 0.05]

